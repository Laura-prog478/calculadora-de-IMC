<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculador de IMC</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <main>
        <div class="container">
            <div class="title">Calculadora de IMC</div>
            <div class="input"><label>Nome:</label>
            <input type="text" id="nome.txt">
        </div>

        <div class="input"><label>Altura:</label>
        <input type="number" id="altura.num">

        <div class="input"><label>Peso:</label>
        <input type="number" id="peso.num">
        </div>

        </div>

        <button id="calcular.num">Calcular</button>
         <script src="./imc.js"></script>

        <div class="result" id="result.num"></div>

        </div>
    </main>
   

</body>
</html>
